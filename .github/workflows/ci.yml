name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l .; exit 1)

      - name: Vet
        run: go vet ./...

      - name: Build every service
        run: go build ./...

      - name: Unit tests
        run: go test -short -race ./...

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The backing services come from docker-compose.yml rather than from
      # GitHub's `services:` block. Two reasons, both practical:
      #
      #   - MongoDB has to start with --replSet, and a service container cannot
      #     override the image command. Compose can.
      #   - One definition instead of two. A service-container copy drifts from
      #     compose the first time either changes, and the failure shows up as a
      #     test that passes locally and fails here.
      - name: Start MongoDB, Redis and Kafka
        run: docker compose up -d --wait mongo-user mongo-seller mongo-product mongo-order mongo-marketplace mongo-live redis kafka

      - name: Full test suite
        env:
          # One instance per service. directConnection because each replica set
          # advertises "mongo-<service>:27017", which resolves inside the
          # compose network and not on the runner.
          MONGO_URI_USER: mongodb://127.0.0.1:27017/?directConnection=true
          MONGO_URI_SELLER: mongodb://127.0.0.1:27018/?directConnection=true
          MONGO_URI_PRODUCT: mongodb://127.0.0.1:27019/?directConnection=true
          MONGO_URI_ORDER: mongodb://127.0.0.1:27020/?directConnection=true
          MONGO_URI_MARKETPLACE: mongodb://127.0.0.1:27021/?directConnection=true
          MONGO_URI_LIVE: mongodb://127.0.0.1:27022/?directConnection=true
          MONGO_DATABASE: ecommerce_test
          # config's own tests clear the environment, so this only satisfies
          # any code path that loads config directly.
          MONGO_URI: mongodb://127.0.0.1:27017/?directConnection=true
          REDIS_ADDR: 127.0.0.1:6379
          KAFKA_BROKERS: 127.0.0.1:29092
          KAFKA_GROUP_ID: ci
          JWT_SECRET: ci-only-secret-of-at-least-32-characters
        run: go test -race -timeout 10m ./...

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail 100

  docker:
    name: Images build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user, seller, product, order, marketplace, live]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.service }}
        run: docker build --build-arg SERVICE=${{ matrix.service }} -t ecommerce-${{ matrix.service }}:ci .
