# Three services, one repository. Each is an independently deployable binary
# with its own port, its own database, and its own consumer group.
#
#   make docker-run     the whole stack
#   make docker-down    stop it
#
# Each service owns a separate MongoDB database on purpose. Sharing one and
# agreeing not to read each other's collections works right up until somebody
# does; separate databases make the boundary something the infrastructure
# enforces rather than something a code review has to catch.

services:
  # One MongoDB per service, not one shared instance with three databases.
  #
  # Separate databases already stopped a service reading another's collections.
  # Separate instances go further and remove the things a shared server keeps
  # shared regardless of database: connection limits, cache, lock contention,
  # a backup and restore schedule, a version upgrade, and a failure. A slow
  # aggregate in the catalogue should not lengthen a login.
  #
  # Each is a single-node replica set, because transactions and change streams
  # both need an oplog. One node buys no redundancy; production runs three.
  #
  # Host ports differ so integration tests can reach each one directly.
  mongo-user:
    image: mongo:8.0
    restart: unless-stopped
    command: ["--replSet", "rs-user", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-user-data:/data/db
    healthcheck:
      test: >-
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch (e) { rs.initiate({_id:'rs-user',members:[{_id:0,host:'mongo-user:27017'}]}) }
        "
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  mongo-seller:
    image: mongo:8.0
    restart: unless-stopped
    command: ["--replSet", "rs-seller", "--bind_ip_all"]
    ports:
      - "27018:27017"
    volumes:
      - mongo-seller-data:/data/db
    healthcheck:
      test: >-
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch (e) { rs.initiate({_id:'rs-seller',members:[{_id:0,host:'mongo-seller:27017'}]}) }
        "
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  mongo-product:
    image: mongo:8.0
    restart: unless-stopped
    command: ["--replSet", "rs-product", "--bind_ip_all"]
    ports:
      - "27019:27017"
    volumes:
      - mongo-product-data:/data/db
    healthcheck:
      test: >-
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch (e) { rs.initiate({_id:'rs-product',members:[{_id:0,host:'mongo-product:27017'}]}) }
        "
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  mongo-order:
    image: mongo:8.0
    restart: unless-stopped
    command: ["--replSet", "rs-order", "--bind_ip_all"]
    ports:
      - "27020:27017"
    volumes:
      - mongo-order-data:/data/db
    healthcheck:
      test: >-
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch (e) { rs.initiate({_id:'rs-order',members:[{_id:0,host:'mongo-order:27017'}]}) }
        "
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  mongo-marketplace:
    image: mongo:8.0
    restart: unless-stopped
    command: ["--replSet", "rs-marketplace", "--bind_ip_all"]
    ports:
      - "27021:27017"
    volumes:
      - mongo-marketplace-data:/data/db
    healthcheck:
      test: >-
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch (e) { rs.initiate({_id:'rs-marketplace',members:[{_id:0,host:'mongo-marketplace:27017'}]}) }
        "
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  mongo-live:
    image: mongo:8.0
    restart: unless-stopped
    command: ["--replSet", "rs-live", "--bind_ip_all"]
    ports:
      - "27022:27017"
    volumes:
      - mongo-live-data:/data/db
    healthcheck:
      test: >-
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch (e) { rs.initiate({_id:'rs-live',members:[{_id:0,host:'mongo-live:27017'}]}) }
        "
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    ports:
      # 9092 is the in-network listener; 29092 is the one host tools can reach.
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    environment:
      # Single-node KRaft: this broker is also the controller, so no ZooKeeper.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

      # Two client listeners, because a broker advertises the address clients
      # must dial back on: containers resolve "kafka", the host cannot.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Replication factors must be 1 on a single broker or topic creation hangs.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Development tool, not part of the system. It reads the broker and renders
  # topics, partitions, consumer groups, lag and message payloads — which is the
  # only way to see an event-driven flow without adding logging to guess at it.
  # It has no authentication configured; do not run it anywhere public.
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      # 8080 inside the container; 8090 on the host, where 8080 is the user service.
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
      # Quieter startup; the UI's own logs are not what anyone opened it for.
      LOGGING_LEVEL_ROOT: warn

  user:
    build:
      context: .
      args:
        SERVICE: user
    restart: unless-stopped
    depends_on:
      mongo-user:
        condition: service_healthy
    ports:
      - "8080:8080"   # REST
      - "9090:9090"   # gRPC
      - "6060:6060"   # metrics and pprof — internal only in a real deployment
    environment:
      MONGO_URI: "mongodb://mongo-user:27017/?replicaSet=rs-user"
      MONGO_DATABASE: "ecommerce"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env or the environment}"
      LOG_LEVEL: "info"

  seller:
    build:
      context: .
      args:
        SERVICE: seller
    restart: unless-stopped
    depends_on:
      mongo-seller:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8081:8080"
      - "6061:6060"
    environment:
      MONGO_URI: "mongodb://mongo-seller:27017/?replicaSet=rs-seller"
      MONGO_DATABASE: "ecommerce"
      # Same secret as the user service: it verifies tokens the user service
      # issued. In production this is where an asymmetric key pair earns its
      # keep — the issuer holds the private key and nobody else can mint tokens.
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env or the environment}"
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_GROUP_ID: "seller-service"
      LOG_LEVEL: "info"

  product:
    build:
      context: .
      args:
        SERVICE: product
    restart: unless-stopped
    depends_on:
      mongo-product:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8082:8080"
      - "6062:6060"
    environment:
      MONGO_URI: "mongodb://mongo-product:27017/?replicaSet=rs-product"
      MONGO_DATABASE: "ecommerce"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env or the environment}"
      KAFKA_BROKERS: "kafka:9092"
      # A group of its own: sharing one with the seller service would have them
      # stealing each other's messages.
      KAFKA_GROUP_ID: "product-service"
      REDIS_ADDR: "redis:6379"
      REDIS_TTL: "5m"
      LOG_LEVEL: "info"

  order:
    build:
      context: .
      args:
        SERVICE: order
    restart: unless-stopped
    depends_on:
      mongo-order:
        condition: service_healthy
      kafka:
        condition: service_healthy
      product:
        condition: service_started
    ports:
      - "8083:8080"
      - "6063:6060"
    environment:
      MONGO_URI: "mongodb://mongo-order:27017/?replicaSet=rs-order"
      MONGO_DATABASE: "ecommerce"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env or the environment}"
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_GROUP_ID: "order-service"
      # The one synchronous dependency in the system. Reachable inside the
      # network only: product publishes no gRPC port to the host.
      PRODUCT_GRPC_ADDR: "product:9090"
      LOG_LEVEL: "info"

  marketplace:
    build:
      context: .
      args:
        SERVICE: marketplace
    restart: unless-stopped
    depends_on:
      mongo-marketplace:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8084:8080"
      - "6064:6060"
    environment:
      MONGO_URI: "mongodb://mongo-marketplace:27017/?replicaSet=rs-marketplace"
      MONGO_DATABASE: "ecommerce"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env or the environment}"
      KAFKA_BROKERS: "kafka:9092"
      # Each stream gets its own group, derived from this prefix, so a backlog
      # on one cannot hold up the others.
      KAFKA_GROUP_ID: "marketplace"
      REDIS_ADDR: "redis:6379"
      # Short: search results have no key to invalidate by, so staleness is
      # bounded by time rather than removed.
      REDIS_TTL: "30s"
      LOG_LEVEL: "info"

  live:
    build:
      context: .
      args:
        SERVICE: live
    restart: unless-stopped
    depends_on:
      mongo-live:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8085:8080"
      - "6065:6060"
    environment:
      MONGO_URI: "mongodb://mongo-live:27017/?replicaSet=rs-live"
      MONGO_DATABASE: "ecommerce"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env or the environment}"
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_GROUP_ID: "live"
      # Required, not optional: presence and broadcast are shared state. Two
      # instances without it would each have their own idea of the audience.
      REDIS_ADDR: "redis:6379"
      LOG_LEVEL: "info"

volumes:
  mongo-user-data:
  mongo-seller-data:
  mongo-product-data:
  mongo-order-data:
  mongo-marketplace-data:
  mongo-live-data:
  redis-data:
  kafka-data:
