services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        # Waiting for healthy rather than started keeps the api from failing
        # its startup ping while Mongo is still initialising.
        condition: service_healthy
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
      MONGO_URI: "mongodb://mongo:27017"
      MONGO_DATABASE: "ecommerce"
      # No default: compose refuses to start if JWT_SECRET is unset, matching
      # the service's own fail-fast rule.
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env or the environment}"
      LOG_LEVEL: "info"

volumes:
  mongo-data:
