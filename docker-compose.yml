# Three services, one repository. Each is an independently deployable binary
# with its own port, its own database, and its own consumer group.
#
#   make docker-run     the whole stack
#   make docker-down    stop it
#
# Each service owns a separate MongoDB database on purpose. Sharing one and
# agreeing not to read each other's collections works right up until somebody
# does; separate databases make the boundary something the infrastructure
# enforces rather than something a code review has to catch.

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    ports:
      # 9092 is the in-network listener; 29092 is the one host tools can reach.
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    environment:
      # Single-node KRaft: this broker is also the controller, so no ZooKeeper.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

      # Two client listeners, because a broker advertises the address clients
      # must dial back on: containers resolve "kafka", the host cannot.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Replication factors must be 1 on a single broker or topic creation hangs.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  user:
    build:
      context: .
      args:
        SERVICE: user
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8080:8080"   # REST
      - "9090:9090"   # gRPC
      - "6060:6060"   # metrics and pprof — internal only in a real deployment
    environment:
      MONGO_URI: "mongodb://mongo:27017"
      MONGO_DATABASE: "ecommerce_user"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env or the environment}"
      LOG_LEVEL: "info"

  seller:
    build:
      context: .
      args:
        SERVICE: seller
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8081:8080"
      - "6061:6060"
    environment:
      MONGO_URI: "mongodb://mongo:27017"
      MONGO_DATABASE: "ecommerce_seller"
      # Same secret as the user service: it verifies tokens the user service
      # issued. In production this is where an asymmetric key pair earns its
      # keep — the issuer holds the private key and nobody else can mint tokens.
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env or the environment}"
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_GROUP_ID: "seller-service"
      LOG_LEVEL: "info"

  product:
    build:
      context: .
      args:
        SERVICE: product
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8082:8080"
      - "6062:6060"
    environment:
      MONGO_URI: "mongodb://mongo:27017"
      MONGO_DATABASE: "ecommerce_product"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env or the environment}"
      KAFKA_BROKERS: "kafka:9092"
      # A group of its own: sharing one with the seller service would have them
      # stealing each other's messages.
      KAFKA_GROUP_ID: "product-service"
      REDIS_ADDR: "redis:6379"
      REDIS_TTL: "5m"
      LOG_LEVEL: "info"

volumes:
  mongo-data:
  redis-data:
  kafka-data:
